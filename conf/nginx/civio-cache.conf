# Civio static-asset caching (Lite plan L0 item 6, Issue #27).
# Copied into the serversideup image as /etc/nginx/server-opts.d/civio-cache.conf,
# which the image includes inside its default `server {}` block.
#
# Only real files under public/ are matched; anything missing falls through
# to 404 here (hashed assets never route to Laravel). HTML, Inertia JSON,
# /exams*, /offline/*, /sw.js and every other PHP response keep the headers
# Laravel sets (SetCacheHeaders: `no-cache, private`).
#
# tests/Perf/gzip-proxy.mjs mirrors these rules for local measurements;
# keep both in step.

# Vite output: content-hashed file names, so safe to cache for a year.
location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

# Unhashed build files must be revalidated.
location ^~ /build/ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location = /manifest.json {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Unhashed images and icons: 30 days, then revalidate by ETag.
location ~ ^/(images|icons)/ {
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
}

location ~ ^/(favicon\.ico|favicon\.svg|apple-touch-icon\.png|robots\.txt)$ {
    add_header Cache-Control "public, max-age=86400" always;
    access_log off;
    try_files $uri =404;
}

