# Local Docker stack for Civio on MSI.
# Does NOT bind :8642 (Hermes). App on host :8080, Postgres on host :5433.
services:
  db:
    image: postgres:16-alpine
    container_name: civio-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cse_reviewer
      POSTGRES_USER: civio
      POSTGRES_PASSWORD: civio_local_dev
    ports:
      - "5433:5432"
    volumes:
      - civio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civio -d cse_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: civio-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_URL: http://localhost:8080
      SESSION_LIFETIME: 43200
      SESSION_DRIVER: database
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: cse_reviewer
      DB_USERNAME: civio
      DB_PASSWORD: civio_local_dev
      CIVIO_GUEST_UNLIMITED: "true"
      CIVIO_CONTENT_SHIELD: "false"

volumes:
  civio_pgdata:

